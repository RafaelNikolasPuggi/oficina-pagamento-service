# MongoDB self-hosted no próprio cluster EKS (em vez de um serviço gerenciado
# como DocumentDB/Atlas) — mantém o custo da Fase 4 próximo do que já era
# gasto na Fase 3. Só este serviço usa, então fica no namespace
# oficina-pagamento (não em oficina-shared).
#
# PersistentVolumeClaim de verdade (StorageClass gp3 via EBS CSI driver,
# habilitado no oficina-infra-k8s) — os dados sobrevivem a reinício de Pod.
# Ainda assim: 1 réplica, sem backup automático — aceitável pra demonstração
# da Fase 4, mesma filosofia "custo mínimo" do RDS single-AZ da Fase 3.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: oficina-ebs-gp3
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
parameters:
  type: gp3
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: oficina-pagamento-mongo-data
  namespace: oficina-pagamento
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: oficina-ebs-gp3
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-pagamento-mongo
  namespace: oficina-pagamento
  labels:
    app: oficina-pagamento-mongo
spec:
  replicas: 1
  strategy:
    type: Recreate # evita 2 Pods disputando a mesma PVC ReadWriteOnce durante um rollout
  selector:
    matchLabels:
      app: oficina-pagamento-mongo
  template:
    metadata:
      labels:
        app: oficina-pagamento-mongo
    spec:
      containers:
        - name: mongodb
          image: mongo:7
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: data
              mountPath: /data/db
          readinessProbe:
            exec:
              command: ['mongosh', '--eval', "db.adminCommand('ping')"]
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 10 # mongosh é um CLI Node.js; o default de 1s nunca é suficiente pra iniciar
          resources:
            requests:
              cpu: '100m'
              memory: '256Mi'
            limits:
              cpu: '500m'
              memory: '512Mi'
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: oficina-pagamento-mongo-data
---
apiVersion: v1
kind: Service
metadata:
  name: oficina-pagamento-mongo
  namespace: oficina-pagamento
spec:
  type: ClusterIP
  selector:
    app: oficina-pagamento-mongo
  ports:
    - port: 27017
      targetPort: 27017
